<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Participant Access</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="loginScreen" class="auth-shell" aria-live="polite">
    <h1 class="brand">Participant Access</h1>
    <p class="subtitle">Please sign in to access this testing page.</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" placeholder="Enter username" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
      </div>

      <button type="submit" class="primary-btn">Login</button>
      <div id="loginMessage" class="message" aria-live="assertive"></div>
    </form>
  </section>

  <main id="contentPage" class="page hidden" aria-live="polite">
    <div class="page-header">
      <h1>Testing Page</h1>
      <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
    </div>

    <div class="page-card">
      <p class="welcome">Welcome, <span id="userNameLabel">Participant</span>!</p>
      <p class="note">This page is ready for testing. Access is restricted to approved participants only.</p>

      <button id="testButton" type="button" class="secondary-btn">Run test</button>
      <div id="result" class="result" role="status" aria-live="polite"></div>

      <div id="messageLinks" class="hidden">
        <p>
          <a href="sms:+917355289961?body=Hello!%20I%20have%20an%20inquiry%20from%20your%20website.">Send SMS to Support</a>
        </p>
        <p>
          <a href="https://wa.me/917355289961?text=Hi!%20I'm%20interested%20in%20Credflex." target="_blank" rel="noopener noreferrer">Chat with us on WhatsApp</a>
        </p>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
