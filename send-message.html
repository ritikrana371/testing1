<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Send Messages</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="light" data-page="send-message">
  <header class="page-header">
    <div class="brand-wrap">
      <h1>Credflex Messaging Panel</h1>
    </div>

    <nav class="top-nav" aria-label="Main navigation">
      <a href="add-contact.html" class="nav-link">Add Contact</a>
      <a href="import-contacts.html" class="nav-link">Import Contacts</a>
      <a href="send-message.html" class="nav-link active">Send Messages</a>
      <button id="logoutBtn" class="logout-btn" type="button">Logout</button>
    </nav>
  </header>

  <main class="page">
    <section class="page-card">
      <h2>Send Message</h2>

      <div class="form-group">
        <label for="contactSearch">Search Recipient</label>
        <input id="contactSearch" type="search" placeholder="Search by name or mobile number" aria-label="Search recipient" />
      </div>

      <div class="form-group">
        <label for="contactSelect">Select Recipient(s)</label>
        <select id="contactSelect" multiple size="8"></select>
      </div>

      <div id="selectedContactInfo" class="selected-contact-info">No contact selected</div>

      <div class="form-group">
        <label for="messageText">Message</label>
        <textarea id="messageText" rows="6" placeholder="Type your message here..."></textarea>
      </div>

      <div class="composer-actions">
        <button type="button" id="saveDraftBtn" class="secondary-btn">Save Draft</button>
        <button type="button" id="copyMessageBtn" class="secondary-btn">Copy</button>
        <button type="button" id="sendSmsBtn" class="primary-btn send-btn">Send SMS</button>
        <button type="button" id="sendWhatsAppBtn" class="primary-btn send-btn">Send WhatsApp</button>
      </div>
    </section>

    <section class="page-card">
      <h3>Saved Messages</h3>
      <div class="draft-row">
        <select id="draftSelect">
          <option value="">Select a saved message</option>
        </select>
        <button type="button" id="loadDraftBtn" class="secondary-btn">Use</button>
      </div>
      <div id="statusMessage" class="status-message" aria-live="polite"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
